name: Bug report
description: Something renders wrong or crashes
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`sctui --version` and `sc --version`"
      placeholder: sctui 0.1.0 · sc 1.0.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, what should happen?
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Raw JSON of the affected view
      description: >
        Press `d` in sctui — the overlay shows the exact sc command and the
        raw response. Paste it here and **redact personal data (balances,
        IDs) first**. Without this JSON, the field-name class of bugs is
        practically undiagnosable.
      render: json
  - type: input
    id: terminal
    attributes:
      label: Terminal & size
      placeholder: WezTerm, 120×30
