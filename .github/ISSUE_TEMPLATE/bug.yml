name: Bug melden
description: Etwas wird falsch angezeigt oder stürzt ab
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versionen
      description: "`sctui --version` und `sc --version`"
      placeholder: sctui 0.1.0 · sc 1.0.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Was passiert, was sollte passieren?
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Roh-JSON der betroffenen Ansicht
      description: >
        In sctui `d` drücken — das Overlay zeigt den abgesetzten sc-Befehl und
        die Rohantwort. Bitte hier einfügen und **persönliche Daten
        (Kontostände, IDs) vorher schwärzen**. Ohne dieses JSON ist die
        Feldnamen-Klasse von Bugs praktisch nicht diagnostizierbar.
      render: json
  - type: input
    id: terminal
    attributes:
      label: Terminal & Größe
      placeholder: iTerm2, 120×30
