name: Feature request
description: A new view, column or capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        **Note:** the current version of sctui is read-only — it cannot change
        anything in your account, and that guarantee is enforced structurally
        ([SECURITY.md](https://github.com/Smileodox/sctui/blob/main/SECURITY.md)).
        Proposals for mutating features (trading, watchlist edits, alerts)
        are welcome but held to a much higher bar: they need a safety design
        that keeps the read-only default intact.
  - type: textarea
    id: proposal
    attributes:
      label: What should sctui be able to do?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Where does the data come from?
      description: >
        Which `sc` command provides it? (`sc --help`, `sc broker --help`)
